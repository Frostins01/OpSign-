name: OpSign
options:
  bundleIdPrefix: com.opsign
  deploymentTarget:
    iOS: "16.0"
packages:
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL
    from: "3.3.2000"
targets:
  OpSign:
    type: application
    platform: iOS
    sources:
      - OpSign
    dependencies:
      - package: OpenSSL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opsign.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpSign
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
